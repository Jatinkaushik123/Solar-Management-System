<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>html,body{background:#0B1320}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1320" />
    <title>Login | Bijli Wala — Solar Installation Management System</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <script defer src="js/core/utils.js"></script>
    <script defer src="js/core/catalog.js"></script>
    <script defer src="js/core/store.js"></script>
    <script defer src="js/core/auth.js"></script>
    <script defer src="js/ui/components.js"></script>
    <script defer src="js/ui/layout.js"></script>
    <script defer src="js/pages/login.js"></script>
  </head>
  <body data-page="Login">
    <main class="login-page">
      <div class="login-hero-copy">
        <h1>Powering a<br /><em>Sustainable</em> Tomorrow</h1>
        <div class="hero-line" aria-hidden="true"></div>
        <p>
          Manage enquiry, project, inventory, and Solar installation in one platform
        </p>
      </div>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-brand">
          <span data-icon="sun"></span>
          Bijli Wala
        </div>
        <h2 id="login-title" class="sr-only">SIMS Login</h2>
        <p class="login-subtitle">
          Customers and staff sign in to their own portal.
        </p>

        <!-- Segmented Tab Toggle (Login / Admin) -->
        <div class="login-switch" role="tablist" aria-label="Choose portal">
          <button type="button" role="tab" id="tab-login" class="active" aria-selected="true">
            Customer
          </button>
          <button type="button" role="tab" id="tab-admin" aria-selected="false">
            Staff
          </button>
        </div>

        <!-- Standard Login Form -->
        <form id="login-form">
          <label for="email">Email</label>
          <div class="login-input">
            <span data-icon="mail"></span>
            <input
              id="email"
              required
              type="email"
              autocomplete="username"
              placeholder="you@example.com"
            />
          </div>

          <div class="password-label-row">
            <label for="password">Password</label>
          </div>
          <div class="login-input">
            <span data-icon="lock-keyhole"></span>
            <input
              required
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Password"
            />
            <button
              type="button"
              id="visibility"
              aria-label="Show password"
              data-icon="eye"
            ></button>
          </div>

          <p class="login-error" role="alert" hidden></p>
          <button class="login-submit" type="submit">Sign-In</button>

          <div class="signup-prompt">
            <span>New User? </span>
            <button type="button" id="toggle-signup" class="text-link">Sign-up ?</button>
          </div>
        </form>

        <!-- Customer Self Sign-Up Form (Hidden by default) -->
        <form id="signup-form" hidden>
          <div class="signup-grid">
            <div class="signup-field">
              <label for="signup-name">Full Name</label>
              <div class="login-input">
              <span data-icon="user"></span>
              <input
              id="signup-name"
              required
              type="text"
              autocomplete="name"
              placeholder="e.g. Ramesh Patel"
              />
              </div>
            </div>
            <div class="signup-field">
              <label for="signup-email">Email Address</label>
              <div class="login-input">
              <span data-icon="mail"></span>
              <input
              id="signup-email"
              required
              type="email"
              autocomplete="email"
              placeholder="ramesh@gmail.com"
              />
              </div>
            </div>
            <div class="signup-field full">
              <label for="signup-password">Create Password</label>
              <div class="login-input">
              <span data-icon="lock-keyhole"></span>
              <input
              id="signup-password"
              required
              type="password"
              minlength="6"
              placeholder="••••••••"
              />
              </div>
            </div>
          </div>

          <p class="signup-error" role="alert" hidden></p>
          <button class="login-submit" type="submit">Create Customer Account</button>

          <div class="signup-prompt">
            <span>Already have an account? </span>
            <button type="button" id="back-to-login" class="text-link">Sign-in here</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
