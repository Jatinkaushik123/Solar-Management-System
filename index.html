<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>html,body{background:#0B1320}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1320" />
    <title>Login | Bijli Wala — Solar Installation Management System</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <script defer src="js/core/utils.js"></script>
    <script defer src="js/core/catalog.js"></script>
    <script defer src="js/core/store.js"></script>
    <script defer src="js/core/auth.js"></script>
    <script defer src="js/ui/components.js"></script>
    <script defer src="js/ui/layout.js"></script>
    <script defer src="js/pages/login.js"></script>
  </head>
  <body data-page="Login">
    <main class="login-page">
      <div class="login-hero-copy">
        <h1>Powering a<br /><em>Sustainable</em> Tomorrow</h1>
        <div class="hero-line" aria-hidden="true"></div>
        <p>
          Manage enquiry, project, inventory, and Solar installation in one platform
        </p>
      </div>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-brand">
          <span data-icon="sun"></span>
          Bijli Wala
        </div>
        <h2 id="login-title" class="sr-only">SIMS Login</h2>
        <p class="login-subtitle">
          Enter your credentials to access the SIMS portal.
        </p>

        <!-- Segmented Tab Toggle (Login / Admin) -->
        <div class="login-switch" role="tablist" aria-label="Portal access mode">
          <button type="button" role="tab" id="tab-login" class="active" aria-selected="true">
            Login
          </button>
          <button type="button" role="tab" id="tab-admin" aria-selected="false">
            Admin
          </button>
        </div>

        <!-- Google Continue Button -->
        <button type="button" class="google-auth-btn" id="google-auth-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Continue With Google
        </button>

        <div class="login-divider">
          <span>Continue with e-mail</span>
        </div>

        <!-- Standard Login Form -->
        <form id="login-form">
          <label for="email">Email or EmployeeID</label>
          <div class="login-input">
            <span data-icon="mail"></span>
            <input
              id="email"
              required
              type="text"
              autocomplete="username"
              placeholder="Email or EmployeeID"
            />
          </div>

          <div class="password-label-row">
            <label for="password">Password</label>
            <a href="#" id="forgot-password" class="forgot-link">Forgot Password ?</a>
          </div>
          <div class="login-input">
            <span data-icon="lock-keyhole"></span>
            <input
              required
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Password"
            />
            <button
              type="button"
              id="visibility"
              aria-label="Show password"
              data-icon="eye"
            ></button>
          </div>

          <div class="login-options-row">
            <label class="remember-label">
              <input type="checkbox" id="remember-me" checked />
              <span>Remember me for 30 days</span>
            </label>
          </div>

          <p class="login-error" role="alert" hidden></p>
          <button class="login-submit" type="submit">Sign-In</button>

          <div class="signup-prompt">
            <span>New User? </span>
            <button type="button" id="toggle-signup" class="text-link">Sign-up ?</button>
          </div>
        </form>

        <!-- Customer Self Sign-Up Form (Hidden by default) -->
        <form id="signup-form" hidden>
          <div class="signup-grid">
            <div class="signup-field">
              <label for="signup-name">Full Name</label>
              <div class="login-input">
              <span data-icon="user"></span>
              <input
              id="signup-name"
              required
              type="text"
              autocomplete="name"
              placeholder="e.g. Ramesh Patel"
              />
              </div>
            </div>
            <div class="signup-field">
              <label for="signup-email">Email Address</label>
              <div class="login-input">
              <span data-icon="mail"></span>
              <input
              id="signup-email"
              required
              type="email"
              autocomplete="email"
              placeholder="ramesh@gmail.com"
              />
              </div>
            </div>
            <div class="signup-field">
              <label for="signup-phone">10-Digit Mobile (India)</label>
              <div class="login-input">
              <span data-icon="activity"></span>
              <input
              id="signup-phone"
              required
              type="tel"
              pattern="[6-9][0-9]{9}"
              maxlength="10"
              placeholder="98XXXXXXXX"
              />
              </div>
            </div>
            <div class="signup-field">
              <label for="signup-city">City</label>
              <select id="signup-city" class="login-select" required>
              <option value="Pune">Pune</option>
              <option value="Ahmedabad">Ahmedabad</option>
              <option value="Surat">Surat</option>
              <option value="Vadodara">Vadodara</option>
              <option value="Rajkot">Rajkot</option>
              <option value="Nashik">Nashik</option>
              <option value="Kochi">Kochi</option>
              <option value="Mumbai">Mumbai</option>
              </select>
            </div>
            <div class="signup-field full">
              <label for="signup-password">Create Password</label>
              <div class="login-input">
              <span data-icon="lock-keyhole"></span>
              <input
              id="signup-password"
              required
              type="password"
              minlength="4"
              placeholder="••••••••"
              />
              </div>
            </div>
          </div>

          <p class="signup-error" role="alert" hidden></p>
          <button class="login-submit" type="submit">Create Customer Account</button>

          <div class="signup-prompt">
            <span>Already have an account? </span>
            <button type="button" id="back-to-login" class="text-link">Sign-in here</button>
          </div>
        </form>

        <div class="login-divider">
          <span>Demo Roles · Click to Instant Sign-In</span>
        </div>
        <div class="demo-pills" role="group" aria-label="Demo role credentials"></div>
      </section>
    </main>
  </body>
</html>
